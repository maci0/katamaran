apiVersion: v1
kind: ServiceAccount
metadata:
  name: katamaran-dashboard
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: katamaran-dashboard-role
  namespace: kube-system
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete", "get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: katamaran-dashboard-binding
  namespace: kube-system
subjects:
- kind: ServiceAccount
  name: katamaran-dashboard
  namespace: kube-system
roleRef:
  kind: Role
  name: katamaran-dashboard-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: katamaran-dashboard-cluster
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "patch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: katamaran-dashboard-cluster-binding
subjects:
- kind: ServiceAccount
  name: katamaran-dashboard
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: katamaran-dashboard-cluster
  apiGroup: rbac.authorization.k8s.io
---
# Source job ServiceAccount + RBAC. Pre-applied at install time so the
# dashboard's Native orchestrator only needs to create migration Jobs at
# runtime.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: katamaran-source
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: katamaran-source
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
# Dest job in --replay-cmdline-from-pod mode reads the source pod's
# log to scrape its KATAMARAN_CMDLINE_B64 marker. Both source and
# dest jobs share this SA, so the read-only get suffices for both.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: katamaran-source
subjects:
- kind: ServiceAccount
  name: katamaran-source
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: katamaran-source
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: katamaran-dashboard
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: katamaran-dashboard
  template:
    metadata:
      labels:
        app: katamaran-dashboard
    spec:
      serviceAccountName: katamaran-dashboard
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dashboard
        image: localhost/katamaran-dashboard:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: KATAMARAN_MIGRATION_IMAGE
          value: localhost/katamaran:dev
        # Comma-separated namespaces the dashboard may list pods from and
        # migrate. Unset means every namespace in the cluster, which is only
        # appropriate when the UI is reachable exclusively by cluster admins.
        # - name: KATAMARAN_ALLOWED_NAMESPACES
        #   value: default
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sleep", "5"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
# No UI Service on purpose. The dashboard's ServiceAccount can list, patch,
# and delete pods cluster-wide and creates hostPID migration Jobs, so a
# ClusterIP Service in front of it would hand that surface to every pod in
# the cluster. Admin access is
# `kubectl port-forward -n kube-system svc/katamaran-dashboard-metrics 8080:8080`,
# which the apiserver proxies and which therefore needs RBAC on pods/portforward
# in kube-system. The katamaran-dashboard-metrics Service further down selects
# the same dashboard pods on the same port, so the forwarded port serves the
# UI as well as Prometheus.
#
# Scrape target for both workloads' Prometheus text endpoints: mgr exposes
# controller + admission counters on :8081/metrics, the dashboard exposes
# HTTP and migration counters on :8080/metrics. Without these objects the
# metrics exist in the apps but no scraper ever collects them.
apiVersion: v1
kind: Service
metadata:
  name: katamaran-mgr-metrics
  namespace: kube-system
  labels:
    app: katamaran-mgr
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8081
    targetPort: debug
    protocol: TCP
  selector:
    app: katamaran-mgr
---
apiVersion: v1
kind: Service
metadata:
  name: katamaran-dashboard-metrics
  namespace: kube-system
  labels:
    app: katamaran-dashboard
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app: katamaran-dashboard
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: katamaran-mgr
  namespace: kube-system
  labels:
    app: katamaran-mgr
spec:
  selector:
    matchLabels:
      app: katamaran-mgr
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: katamaran-dashboard
  namespace: kube-system
  labels:
    app: katamaran-dashboard
spec:
  selector:
    matchLabels:
      app: katamaran-dashboard
  endpoints:
  - port: metrics
    interval: 30s
