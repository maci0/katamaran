# The migration Jobs this dashboard's orchestrator creates run as the
# `katamaran-source` ServiceAccount, which lives in deploy/job-rbac.yaml
# (shared with katamaran-mgr and deploy/migrate.sh). Apply that file too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: katamaran-dashboard
  namespace: kube-system
  labels:
    app.kubernetes.io/name: katamaran
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: katamaran
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: katamaran-dashboard-role
  namespace: kube-system
  labels:
    app.kubernetes.io/name: katamaran
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: katamaran
    app.kubernetes.io/managed-by: kubectl
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete", "get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: katamaran-dashboard-binding
  namespace: kube-system
  labels:
    app.kubernetes.io/name: katamaran
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: katamaran
    app.kubernetes.io/managed-by: kubectl
subjects:
- kind: ServiceAccount
  name: katamaran-dashboard
  namespace: kube-system
roleRef:
  kind: Role
  name: katamaran-dashboard-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: katamaran-dashboard-cluster
  labels:
    app.kubernetes.io/name: katamaran
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: katamaran
    app.kubernetes.io/managed-by: kubectl
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "patch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: katamaran-dashboard-cluster-binding
  labels:
    app.kubernetes.io/name: katamaran
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: katamaran
    app.kubernetes.io/managed-by: kubectl
subjects:
- kind: ServiceAccount
  name: katamaran-dashboard
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: katamaran-dashboard-cluster
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: katamaran-dashboard
  namespace: kube-system
  labels:
    app.kubernetes.io/name: katamaran
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: katamaran
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: katamaran-dashboard
  template:
    metadata:
      labels:
        app: katamaran-dashboard
        app.kubernetes.io/name: katamaran
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/part-of: katamaran
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: katamaran-dashboard
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dashboard
        image: localhost/katamaran-dashboard:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: KATAMARAN_MIGRATION_IMAGE
          value: localhost/katamaran:dev
        # Comma-separated namespaces the dashboard may list pods from and
        # migrate. Unset means every namespace in the cluster, which is only
        # appropriate when the UI is reachable exclusively by cluster admins.
        # - name: KATAMARAN_ALLOWED_NAMESPACES
        #   value: default
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sleep", "5"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # /healthz binds as soon as the process is up; the startup probe
        # gates liveness during boot instead of guessing with
        # initialDelaySeconds. /readyz covers the rest: it stays 503 until
        # an orchestrator is wired, which is what keeps a pod that cannot
        # serve migrations out of the port-forward target.
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 20
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
# No UI Service in this file on purpose. The dashboard's ServiceAccount can
# list, patch, and delete pods cluster-wide and creates hostPID migration
# Jobs, so nothing here should hand that surface to the cluster at large. Admin
# access is
# `kubectl port-forward -n kube-system svc/katamaran-dashboard-metrics 8080:8080`,
# which the apiserver proxies and which therefore needs RBAC on
# pods/portforward in kube-system. That Service is plain core/v1, so it lives
# in `deploy/metrics-services.yaml` where it applies without a Prometheus
# Operator; it selects these same pods on port 8080, so the forwarded port
# serves the UI as well as Prometheus.
