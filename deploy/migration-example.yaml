# Example Migration CR. Apply with:
#
#   kubectl apply -f demo/nginx-kata.yaml           # the source pod, kata-qemu
#   kubectl apply -f config/crd/migration.yaml      # one-time CRD install
#   kubectl apply -f deploy/manager.yaml           # one-time controller install
#   kubectl apply -f deploy/migration-example.yaml  # this file
#   kubectl get migration -w                        # watch the phase column
#
# The katamaran-mgr controller picks the CR up, resolves source pod
# node + dest node IP, submits source/dest Jobs through the same Native
# orchestrator the dashboard uses, and patches .status.phase as the
# migration progresses.
#
# The source pod and dest node named below are the ones the README
# tutorial creates: pod nginx-kata in the default namespace, running on
# the minikube profile's first node, with the second node as the
# destination. Substitute your own.
apiVersion: katamaran.io/v1alpha1
kind: Migration
metadata:
  name: demo-1
  namespace: default
spec:
  # Pod whose VM should move. Must be runtimeClassName=kata-qemu, and
  # its namespace must match the Migration CR's own namespace.
  sourcePod:
    namespace: default
    name: nginx-kata
  # Where to land it. Must be a different node than the source pod runs
  # on. Omit it to let the controller pick one, using the source pod's
  # scheduling constraints plus an anti-affinity on the source node.
  destNode: katamaran-demo-m02
  # katamaran image with the source/dest binaries.
  image: localhost/katamaran:dev
  # Skip storage migration when the underlying volumes are network-attached.
  sharedStorage: true
  # Spawn the destination QEMU via cmdline replay (zero-config dest, no
  # placeholder kata pod required on the dest node).
  replayCmdline: true
  # Tunnel mode for in-flight packet redirection. Use 'none' on shared-storage
  # demos where you do not need the IPIP/GRE tunnel.
  tunnelMode: ipip
  # Manual downtime budget in milliseconds. Ignored when autoDowntime: true.
  downtimeMS: 25
  # When true, the source binary ICMP-pings the destination node and sets
  # the QEMU downtime limit to rtt × 2 + 25ms. The chosen value
  # is exposed in .status.appliedDowntimeMS along with .status.rttMS and
  # .status.autoDowntime once the migration starts.
  autoDowntime: false
