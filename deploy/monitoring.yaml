# Prometheus Operator scrape configuration for both workloads' text
# endpoints. Selects the Services declared in deploy/metrics-services.yaml by
# their `app` label; apply that file first, or these ServiceMonitors select
# nothing and Prometheus silently scrapes no katamaran metrics.
#
# Kept apart from the workloads' own manifests because the ServiceMonitor
# kind ships with the Prometheus Operator, not with Kubernetes. Applying them
# on a cluster without that operator fails on both documents below. Apply
# only where a Prometheus Operator is installed:
#
#   kubectl apply -f deploy/metrics-services.yaml
#   kubectl apply -f deploy/monitoring.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: katamaran-mgr
  namespace: kube-system
  labels:
    app: katamaran-mgr
spec:
  selector:
    matchLabels:
      app: katamaran-mgr
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: katamaran-dashboard
  namespace: kube-system
  labels:
    app: katamaran-dashboard
spec:
  selector:
    matchLabels:
      app: katamaran-dashboard
  endpoints:
  - port: metrics
    interval: 30s
