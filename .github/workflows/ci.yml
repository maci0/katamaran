name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only cancel in-flight runs on PRs. On main pushes, let every commit's
  # CI finish so we keep a per-commit signal (useful when tagging or when
  # several merges land in quick succession).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOVULNCHECK_VERSION: v1.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go modules
        run: go mod verify
      - name: Lint
        run: make vet
      - name: Cache govulncheck binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-${{ env.GOVULNCHECK_VERSION }}
      - name: Vulnerability check
        # Install + run govulncheck directly. The previous
        # golang/govulncheck-action runs a nested actions/checkout that
        # conflicts with the outer actions/checkout v6's persistent
        # credentials, producing a `remote: Duplicate header:
        # "Authorization"` HTTP 400. Direct invocation bypasses the
        # nested checkout entirely. No untrusted input is interpolated.
        run: |
          if [ ! -x "$HOME/go/bin/govulncheck" ]; then
            go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          fi
          "$HOME/go/bin/govulncheck" ./...
      - name: Unit tests
        run: make test
      - name: Fuzz seeds
        run: make fuzz

  # Release images ship linux/amd64 + linux/arm64 (see release.yml), but
  # every other job here runs on x86_64 only. Run the same lint + unit +
  # fuzz-seed suite on arm64 hardware so architecture regressions surface
  # in CI instead of only in published multi-arch images.
  test-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        run: make vet
      - name: Unit tests
        run: make test
      - name: Fuzz seeds
        run: make fuzz

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        run: make lint-shell

  dependency-review:
    # Surface known-vulnerable / license-incompatible deps newly introduced
    # by a PR before merge. Skipped on push events because the action only
    # supports diff-based comparison via the GitHub API.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@1e966ba708e4b64bb0c9bfb7abb5a232840be16a # v4.10.0
        with:
          fail-on-severity: high

  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binaries
        run: make -j4 all
      - name: Smoke tests
        run: make smoke

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint-and-test, test-arm64, build-and-smoke, shellcheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: katamaran
            file: Dockerfile
            tag: katamaran:ci
            smoke: --version
          - name: dashboard
            file: Dockerfile.dashboard
            tag: katamaran-dashboard:ci
            smoke: --version
          - name: mgr
            file: Dockerfile.mgr
            tag: katamaran-mgr:ci
            smoke: --version
          - name: factory
            file: Dockerfile.factory
            tag: katamaran-factory:ci
            smoke: --version
    env:
      VERSION_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build ${{ matrix.name }} image (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ env.VERSION_SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Build native image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          tags: ${{ matrix.tag }}
          load: true
          push: false
          build-args: |
            VERSION=${{ env.VERSION_SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Smoke-test ${{ matrix.name }} image
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          SMOKE_CMD: ${{ matrix.smoke }}
        run: docker run --rm "${IMAGE_TAG}" ${SMOKE_CMD}
