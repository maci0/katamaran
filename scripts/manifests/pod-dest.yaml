apiVersion: v1
kind: Pod
metadata:
  name: mig-helper
spec:
  nodeSelector:
    katamaran-role: dest
  # pause ships no USER, so without this floor kubelet runs it as root.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        cpu: 1m
        memory: 4Mi
      limits:
        cpu: 10m
        memory: 16Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
